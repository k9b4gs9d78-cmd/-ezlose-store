<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EZLOSE STORE</title>

<style>

body {

  margin: 0;

  background: #10091c;

  color: white;

  font-family: Arial, sans-serif;

}

header {

  padding: 20px;

  background: #1b102b;

  color: #e879f9;

  font-size: 24px;

  font-weight: bold;

  text-align: center;

}

.hero {

  text-align: center;

  padding: 35px 15px;

  background: linear-gradient(135deg,#251039,#10091c);

}

h1 { color: #e879f9; }

.products {

  display: grid;

  grid-template-columns: repeat(2,minmax(0,1fr));

  gap: 12px;

  padding: 15px;

}

.card {

  background: #211330;

  border: 1px solid #6b21a8;

  border-radius: 12px;

  padding: 15px;

  text-align: center;

}

.icon { font-size: 38px; }

.price {

  color: #e879f9;

  font-size: 20px;

  font-weight: bold;

}

button {

  background: #9333ea;

  color: white;

  border: 0;

  padding: 10px;

  border-radius: 8px;

  width: 100%;

}

footer {

  text-align: center;

  padding: 25px;

  color: #b9a9cc;

}

</style>

</head>

<body>

<header>💜 EZLOSE STORE</header>

<section class="hero">

  <h1>WELCOME TO EZLOSE</h1>

  <p>ร้านค้าดิจิทัล ธีมม่วงดำ Neon</p>

  <p>เลือกสินค้าที่คุณต้องการได้เลย</p>

</section>

<div class="products">

  <div class="card">

    <div class="icon">🔑</div>

    <h3>Digital Key</h3>

    <p>คีย์ดิจิทัลตัวอย่าง</p>

    <div class="price">฿49</div>

    <button onclick="alert('นี่คือสินค้าตัวอย่าง')">ดูสินค้า</button>

  </div>

  <div class="card">

    <div class="icon">💎</div>

    <h3>Premium</h3>

    <p>แพ็กเกจตัวอย่าง</p>

    <div class="price">฿99</div>

    <button onclick="alert('นี่คือสินค้าตัวอย่าง')">ดูสินค้า</button>

  </div>

  <div class="card">

    <div class="icon">📦</div>

    <h3>Digital File</h3>

    <p>ไฟล์ดิจิทัลตัวอย่าง</p>

    <div class="price">฿29</div>

    <button onclick="alert('นี่คือสินค้าตัวอย่าง')">ดูสินค้า</button>

  </div>

  <div class="card">

    <div class="icon">👑</div>

    <h3>VIP Package</h3>

    <p>แพ็กเกจตัวอย่าง</p>

    <div class="price">฿159</div>

    <button onclick="alert('นี่คือสินค้าตัวอย่าง')">ดูสินค้า</button>

  </div>

</div>

<footer>EZLOSE STORE © 2026<br>เว็บไซต์ตัวอย่าง</footer>

</body>

</html>
